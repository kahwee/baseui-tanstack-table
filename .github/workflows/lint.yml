name: Lint and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run ESLint
        run: bun run lint
        
      - name: TypeScript Check
        run: bun run typecheck
        
      - name: Build with Vite
        run: bun run build